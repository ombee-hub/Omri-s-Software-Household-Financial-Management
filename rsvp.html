<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#6b2f5a">
    <link rel="icon" type="image/png" href="images/heart-icon.png">
    <title>אישור הגעה לחתונה</title>
    <link rel="stylesheet" href="css/app.css?v=51">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at 15% 15%, rgba(184, 137, 74, 0.18), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(107, 47, 90, 0.22), transparent 45%),
                linear-gradient(135deg, #faf7f6, #f1e6ec);
        }
        .rsvp-card {
            background: white;
            border-radius: 22px;
            width: 100%;
            max-width: 460px;
            padding: 34px 28px 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(107, 47, 90, 0.16);
        }
        .rsvp-logo { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px; display: block; }
        .rsvp-couple { font-size: 1.7rem; font-weight: 700; color: var(--primary); line-height: 1.25; }
        .rsvp-event { color: var(--gray-dark); margin-top: 8px; font-size: 0.95rem; line-height: 1.7; }
        .rsvp-greeting { font-size: 1.12rem; font-weight: 600; margin: 22px 0 6px; color: var(--dark); }
        .rsvp-sub { color: var(--gray-dark); font-size: 0.92rem; margin-bottom: 18px; }
        .choices { display: grid; gap: 10px; margin-bottom: 18px; }
        .choice {
            border: 2px solid var(--border);
            background: white;
            border-radius: 14px;
            padding: 14px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--dark);
            transition: 0.15s;
        }
        .choice:hover { border-color: var(--primary-lighter); }
        .choice.on[data-v="yes"] { border-color: #0ca30c; background: #ecf8ec; color: #077007; }
        .choice.on[data-v="maybe"] { border-color: #ec835a; background: #fdf1ec; color: #a24a25; }
        .choice.on[data-v="no"] { border-color: #d03b3b; background: #fbecec; color: #a32626; }
        .count-box { margin-bottom: 18px; }
        .count-label { font-weight: 600; margin-bottom: 10px; }
        .stepper { display: inline-flex; align-items: center; gap: 18px; }
        .stepper button {
            width: 46px; height: 46px; border-radius: 50%;
            border: 2px solid var(--border); background: white;
            font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--primary);
            font-family: inherit;
        }
        .stepper button:disabled { opacity: 0.35; cursor: default; }
        .stepper .num { font-size: 2rem; font-weight: 700; min-width: 40px; color: var(--dark); }
        .rsvp-card textarea { width: 100%; margin-bottom: 18px; text-align: right; }
        .rsvp-card .btn-primary { width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem; }
        .rsvp-error { color: var(--danger); font-size: 0.9rem; margin-bottom: 12px; display: none; }
        .thanks-emoji { font-size: 3.4rem; margin: 18px 0 6px; }
        .answer-summary { background: var(--light-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin: 16px 0; color: var(--dark); }
        .link-btn { background: none; border: none; color: var(--primary); font-family: inherit; font-size: 0.95rem; cursor: pointer; text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="rsvp-card" id="card">
        <img src="images/heart-icon.png" alt="" class="rsvp-logo">
        <div class="rsvp-couple" id="couple">טוען...</div>
        <div class="rsvp-event" id="eventInfo"></div>

        <!-- Answer form -->
        <section id="formView" class="hidden">
            <div class="rsvp-greeting" id="greeting"></div>
            <div class="rsvp-sub">נשמח לדעת אם תגיעו</div>
            <div class="choices" role="radiogroup" aria-label="אישור הגעה">
                <button type="button" class="choice" data-v="yes" role="radio">כן, נגיע 🎉</button>
                <button type="button" class="choice" data-v="maybe" role="radio">עוד לא בטוחים</button>
                <button type="button" class="choice" data-v="no" role="radio">לצערנו לא נוכל להגיע</button>
            </div>
            <div class="count-box hidden" id="countBox">
                <div class="count-label">כמה תגיעו?</div>
                <div class="stepper">
                    <button type="button" id="plusBtn" aria-label="עוד אחד">+</button>
                    <span class="num" id="countNum">1</span>
                    <button type="button" id="minusBtn" aria-label="אחד פחות">−</button>
                </div>
            </div>
            <textarea id="note" class="form-textarea" maxlength="500" placeholder="הערות (לא חובה): צמחוני, אלרגיות, ילדים..."></textarea>
            <div class="rsvp-error" id="error"></div>
            <button type="button" class="btn btn-primary" id="sendBtn">שליחה</button>
        </section>

        <!-- After answering -->
        <section id="doneView" class="hidden">
            <div class="thanks-emoji" id="thanksEmoji">💜</div>
            <div class="rsvp-greeting" id="thanksTitle">תודה!</div>
            <div class="answer-summary" id="answerSummary"></div>
            <button type="button" class="link-btn" id="changeBtn">שינוי תשובה</button>
        </section>

        <!-- Bad / missing link -->
        <section id="notFoundView" class="hidden">
            <div class="rsvp-greeting">הקישור לא נמצא</div>
            <div class="rsvp-sub">ייתכן שהקישור לא הועתק במלואו. אפשר לבקש קישור חדש מהזוג.</div>
        </section>
    </main>

    <script>
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        const $ = (id) => document.getElementById(id);
        const token = new URLSearchParams(location.search).get('c') || '';
        let ref = null;
        let invite = null;
        let choice = null;
        let count = 1;

        function show(view) {
            ['formView', 'doneView', 'notFoundView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
        }

        function fmtDate(iso) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return '';
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function maxCount() { return (invite.invited || 1) + 3; }

        function renderCount() {
            $('countNum').textContent = count;
            $('minusBtn').disabled = count <= 1;
            $('plusBtn').disabled = count >= maxCount();
        }

        function setChoice(v) {
            choice = v;
            document.querySelectorAll('.choice').forEach(b => {
                const on = b.dataset.v === v;
                b.classList.toggle('on', on);
                b.setAttribute('aria-checked', on ? 'true' : 'false');
            });
            $('countBox').classList.toggle('hidden', v !== 'yes');
        }

        function showDone() {
            const text = invite.status === 'yes'
                ? `אישרתם הגעה: <strong>${esc(invite.count)}</strong> ${invite.count === 1 ? 'אורח' : 'אורחים'}`
                : invite.status === 'maybe' ? 'סימנתם: עוד לא בטוחים' : 'סימנתם שלא תוכלו להגיע';
            $('thanksEmoji').textContent = invite.status === 'yes' ? '🎉' : invite.status === 'no' ? '💜' : '🤞';
            $('thanksTitle').textContent = invite.status === 'yes' ? 'מחכים לראות אתכם!' : 'תודה שעדכנתם!';
            $('answerSummary').innerHTML = text + (invite.note ? `<div class="muted" style="margin-top:6px">${esc(invite.note)}</div>` : '');
            show('doneView');
        }

        function showForm() {
            $('greeting').textContent = `היי ${invite.name || ''}`;
            count = invite.status === 'yes' && invite.count ? invite.count : (invite.invited || 1);
            $('note').value = invite.note || '';
            setChoice(invite.status || null);
            renderCount();
            show('formView');
        }

        async function send() {
            const err = $('error');
            err.style.display = 'none';
            if (!choice) {
                err.textContent = 'נא לבחור אחת מהאפשרויות';
                err.style.display = 'block';
                return;
            }
            const btn = $('sendBtn');
            btn.disabled = true;
            btn.textContent = 'שולח...';
            const answer = {
                status: choice,
                count: choice === 'yes' ? count : 0,
                note: $('note').value.trim().slice(0, 500),
                respondedAt: Date.now(),
            };
            try {
                const wasAnswered = !!invite.respondedAt;
                await ref.update(answer);
                invite = { ...invite, ...answer };
                showDone();
                notifyCouple(answer, wasAnswered);
            } catch (e) {
                console.error(e);
                err.textContent = 'לא הצלחנו לשלוח. בדקו את החיבור לאינטרנט ונסו שוב.';
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'שליחה';
            }
        }

        // Phone notification to the couple (ntfy), if they turned it on. Never blocks the guest.
        let eventInfo = {};
        function notifyCouple(answer, changed) {
            const topic = eventInfo.notifyTopic;
            const wa = Array.isArray(eventInfo.waNotify) ? eventInfo.waNotify : [];
            if (!topic && !wa.length) return;
            const who = eventInfo.notifyNames === false ? 'מוזמן' : (invite.name || 'מוזמן');
            const what = answer.status === 'yes'
                ? `מגיעים ${answer.count} ${answer.count === 1 ? 'אורח' : 'אורחים'}`
                : answer.status === 'maybe' ? 'עוד לא בטוחים' : 'לא יוכלו להגיע';
            const title = (answer.status === 'yes' ? '🎉 אישור הגעה' : answer.status === 'no' ? '😔 לא מגיעים' : '🤔 אולי') + (changed ? ' (שינוי תשובה)' : '');
            const message = `${who}: ${what}` + (answer.note && eventInfo.notifyNames !== false ? `\n💬 ${answer.note}` : '');
            // WhatsApp via CallMeBot - one message per recipient (we can't read the reply, only send)
            wa.forEach(r => {
                if (!r || !r.phone || !r.apikey) return;
                const url = 'https://api.callmebot.com/whatsapp.php?phone=' + encodeURIComponent(r.phone) +
                    '&text=' + encodeURIComponent(title + '\n' + message) + '&apikey=' + encodeURIComponent(r.apikey);
                fetch(url, { mode: 'no-cors', keepalive: true }).catch(() => {});
            });
            if (!topic) return;
            fetch('https://ntfy.sh/', {
                method: 'POST',
                keepalive: true,
                body: JSON.stringify({
                    topic, title, message, priority: 4,
                    tags: [answer.status === 'yes' ? 'tada' : answer.status === 'no' ? 'disappointed' : 'thinking'],
                    click: new URL('guests.html', location.href).href,
                }),
            }).catch(() => {});
        }

        document.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => setChoice(b.dataset.v)));
        $('plusBtn').addEventListener('click', () => { if (count < maxCount()) { count++; renderCount(); } });
        $('minusBtn').addEventListener('click', () => { if (count > 1) { count--; renderCount(); } });
        $('sendBtn').addEventListener('click', send);
        $('changeBtn').addEventListener('click', showForm);

        (async function load() {
            // Event details are optional - the page works without them
            db.collection('publicEvent').doc('main').get().then(snap => {
                const ev = snap.exists ? snap.data() : {};
                eventInfo = ev;
                if (ev.coupleTitle) {
                    $('couple').textContent = ev.coupleTitle;
                    document.title = 'אישור הגעה - ' + ev.coupleTitle;
                }
                const parts = [fmtDate(ev.weddingDate), ev.eventTime ? 'בשעה ' + ev.eventTime : '', ev.venue].filter(Boolean);
                $('eventInfo').innerHTML = parts.map(esc).join('<br>');
            }).catch(() => {});

            if (!/^[A-Za-z0-9]{10,64}$/.test(token)) { $('couple').textContent = 'אישור הגעה'; show('notFoundView'); return; }
            try {
                ref = db.collection('rsvp').doc(token);
                const snap = await ref.get();
                if (!snap.exists) throw new Error('not found');
                invite = snap.data();
                if ($('couple').textContent === 'טוען...') $('couple').textContent = 'אישור הגעה לחתונה';
                if (invite.respondedAt) showDone(); else showForm();
            } catch (e) {
                console.warn(e);
                $('couple').textContent = 'אישור הגעה';
                show('notFoundView');
            }
        })();
    </script>
</body>
</html>
