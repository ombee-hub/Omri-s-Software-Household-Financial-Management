<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="theme-color" content="#6b2f5a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="החתונה שלנו">
    <link rel="manifest" href="pwa/manifest.json">
    <link rel="apple-touch-icon" href="images/heart-icon.png">
    <link rel="icon" type="image/png" href="images/heart-icon.png">
    <title>החתונה שלנו - טבלת ייאוש</title>
    <link rel="stylesheet" href="css/app.css?v=51">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <style>
        .cd-hero { display: flex; flex-wrap: wrap; margin: 0 -7px 18px; }
        .cd-hero .cd-count { margin: 0 7px 14px; }
        .cd-count {
            flex: 1;
            min-width: 180px;
            border-radius: var(--radius);
            padding: 18px 20px;
            color: white;
        }
        .cd-count.wedding { background: linear-gradient(135deg, var(--primary-dark), var(--primary-light)); }
        .cd-count.henna { background: linear-gradient(135deg, #8a5a1f, #c08a3e); }
        .cd-count-num { font-size: 3rem; font-weight: 700; line-height: 1; }
        .cd-count-label { opacity: 0.9; margin-top: 6px; }
        .cd-progress-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
        .cd-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

        .cd-months { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
        .cd-month { margin-bottom: 0; }
        .cd-month-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
        .cd-month-count { font-size: 0.8rem; color: var(--gray-dark); font-weight: 500; }
        .cd-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cd-dow { text-align: center; font-size: 0.75rem; color: var(--gray); font-weight: 600; padding-bottom: 2px; }
        .cd-day {
            position: relative;
            aspect-ratio: 1;
            min-height: 36px; /* older iPhones without aspect-ratio still get proper squares */
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cd-day.empty { border: none; background: none; }
        .cd-day.out { color: var(--border); background: var(--light-2); }
        .cd-day.today { border: 2px solid var(--primary); }
        .cd-day.passed { background: #fbf3f8; color: var(--gray); }
        /* Automatic red X: a plain SVG drawing, which every browser (old iPhones included) shows */
        .cd-x {
            position: absolute;
            top: 12%;
            left: 12%;
            width: 76%;
            height: 76%;
            fill: none;
            stroke: #d03b3b;
            stroke-width: 1.3;
            stroke-linecap: round;
            pointer-events: none;
        }
        .cd-day.henna { background: linear-gradient(135deg, #8a5a1f, #c08a3e); color: white; border: none; font-size: 1.2rem; }
        .cd-day.wedding { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; font-size: 1.3rem; }
        .cd-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: var(--gray-dark); margin-bottom: 16px; }
        .cd-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .cd-swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); position: relative; display: inline-block; }

        @media print {
            .sidebar, .mobile-topbar, .sidebar-overlay, .cd-actions, .no-print { display: none !important; }
            body.has-sidebar { padding-right: 0 !important; }
            .cd-month { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
            .cd-x, .cd-day.henna, .cd-day.wedding, .cd-count { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div class="splash" id="splash"><div class="splash-heart"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div></div>
    <div id="appHeader"></div>

    <div class="page-title-bar">
        <div class="container">
            <h2>טבלת ייאוש</h2>
            <div class="subtitle">כל יום מקבל איקס לבד, כבר מתחילתו (מחצות). רק לחכות 😊</div>
        </div>
    </div>

    <main class="container">
        <div id="hero" class="cd-hero"></div>
        <div class="card" id="progressCard"></div>
        <div class="cd-legend no-print">
            <span><span class="cd-swatch" style="background:#fbf3f8"></span> איקס אוטומטי (כל יום מחצות)</span>
            <span><span class="cd-swatch" style="border:2px solid var(--primary)"></span> היום</span>
            <span><span class="cd-swatch" style="background:linear-gradient(135deg,#8a5a1f,#c08a3e);border:none"></span> חינה</span>
            <span><span class="cd-swatch" style="background:linear-gradient(135deg,var(--primary),var(--primary-light));border:none"></span> חתונה</span>
        </div>
        <div class="cd-months" id="months"></div>
    </main>

    <script src="js/app.js?v=94"></script>
    <script>
        const MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
        const DOW = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
        const WEDDING_DATE = '2027-02-03'; // fixed
        const HENNA_DATE = '2027-01-20';
        const ref = () => db.collection('countdown').doc('main');
        const X_SVG = '<svg class="cd-x" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1 9 9M9 1 1 9"/></svg>';
        let startDate = '';  // first day of the table

        const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        const fromIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
        const weddingIso = () => weddingSettings.weddingDate || WEDDING_DATE;
        const hennaIso = () => weddingSettings.hennaDate || HENNA_DATE;

        // All days from the start up to (not including) the wedding day
        function tableDays() {
            const w = weddingIso();
            if (!startDate || startDate >= w) return [];
            const out = [];
            for (let d = fromIso(startDate); iso(d) < w; d = addDays(d, 1)) out.push(iso(d));
            return out;
        }

        function countCard(cls, emoji, title, dateIso) {
            const left = daysUntil(dateIso);
            const num = left > 0 ? fmtNum(left) : emoji;
            const label = left > 1 ? `ימים ל${title} · ${fmtDate(dateIso)}`
                : left === 1 ? `מחר ה${title}! · ${fmtDate(dateIso)}`
                : left === 0 ? `היום ה${title}! 🎉` : `ה${title} הייתה ב-${fmtDate(dateIso)}`;
            return `<div class="cd-count ${cls}"><div class="cd-count-num">${num}</div><div class="cd-count-label">${label}</div></div>`;
        }

        function render() {
            const w = weddingIso(), h = hennaIso();
            const days = tableDays();
            const today = todayISO();
            document.getElementById('hero').innerHTML =
                (h < w ? countCard('henna', '🌿', 'חינה', h) : '') + countCard('wedding', '💍', 'חתונה', w);

            // Each day gets its X automatically as soon as it starts (from midnight)
            const passed = days.filter(d => d <= today).length;
            const pct = days.length ? Math.round(passed / days.length * 100) : 0;
            document.getElementById('progressCard').innerHTML = `
                <div class="cd-progress-row"><span>עברו</span><span><strong>${fmtNum(passed)}</strong> מתוך ${fmtNum(days.length)} ימים (${pct}%)</span></div>
                <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div class="cd-actions"><button class="btn btn-outline btn-sm" onclick="window.print()">הדפסה</button></div>`;

            const monthsEl = document.getElementById('months');
            if (!days.length) { monthsEl.innerHTML = ''; return; }
            const byMonth = new Map();
            days.forEach(d => { const k = d.slice(0, 7); (byMonth.get(k) || byMonth.set(k, []).get(k)).push(d); });
            if (!byMonth.has(w.slice(0, 7))) byMonth.set(w.slice(0, 7), []);
            monthsEl.innerHTML = [...byMonth.keys()].map(key => {
                const [y, m] = key.split('-').map(Number);
                const first = new Date(y, m - 1, 1);
                const dim = new Date(y, m, 0).getDate();
                const inTable = new Set(byMonth.get(key));
                const monthPassed = byMonth.get(key).filter(d => d <= today).length;
                let cells = DOW.map(d => `<div class="cd-dow">${d}</div>`).join('');
                for (let i = 0; i < first.getDay(); i++) cells += '<div class="cd-day empty"></div>';
                for (let day = 1; day <= dim; day++) {
                    const d = iso(new Date(y, m - 1, day));
                    if (d === w) { cells += `<div class="cd-day wedding" title="יום החתונה">💍</div>`; continue; }
                    if (!inTable.has(d)) { cells += `<div class="cd-day out">${day}</div>`; continue; }
                    const cls = [d <= today ? 'passed' : '', d === today ? 'today' : '', d === h ? 'henna' : ''].filter(Boolean).join(' ');
                    const content = (d === h ? '🌿' : day) + (d <= today ? X_SVG : '');
                    const title = d === h ? 'יום החינה' : d === today ? 'היום' : d < today ? 'עבר' : '';
                    cells += `<div class="cd-day ${cls}" title="${title}" aria-label="${day} ב${MONTHS[m - 1]}${title ? ' – ' + title : ''}">${content}</div>`;
                }
                return `<div class="card cd-month">
                    <div class="cd-month-title"><span>${MONTHS[m - 1]} ${y}</span>${inTable.size ? `<span class="cd-month-count">${monthPassed}/${inTable.size}</span>` : ''}</div>
                    <div class="cd-grid">${cells}</div>
                </div>`;
            }).join('');
        }

        // A new day starts while the page is open: refresh at midnight
        function scheduleMidnight() {
            const now = new Date();
            const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
            setTimeout(() => { render(); scheduleMidnight(); }, next - now);
        }
        const LOADED_AT = Date.now();
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            if (Date.now() - LOADED_AT > 60 * 60 * 1000) { location.reload(); return; }
            render();
        });
        // iPhone: reopening from the app switcher can restore the page without any event
        window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

        document.addEventListener('settings:change', render);
        document.addEventListener('auth:ready', () => {
            ref().onSnapshot(async (snap) => {
                const data = snap.exists ? snap.data() : {};
                startDate = data.startDate || '';
                // First visit: the table starts today
                if (!startDate) {
                    startDate = todayISO();
                    try { await ref().set({ startDate }, { merge: true }); } catch (e) {}
                }
                render();
            }, (err) => console.error('countdown listener', err));
            scheduleMidnight();
        });
    </script>
</body>
</html>
