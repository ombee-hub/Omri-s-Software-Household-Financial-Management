<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#1e3a5f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="התוכנה של עמרי">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/Omri's%20Software%20-%20icon.png">
    <link rel="icon" type="image/png" href="images/Omri's%20Software%20-%20icon.png">
    <title>התוכנה של עמרי - כלל דפים</title>
    <link rel="stylesheet" href="app.css?v=23">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="firebase-init.js"></script>
    <style>
        .upload-zone {
            border: 2px dashed var(--border);
            background: var(--light-2);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            color: var(--gray-dark);
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(30, 58, 95, 0.04);
            color: var(--primary);
        }
        .upload-zone svg { width: 40px; height: 40px; margin-bottom: 8px; }
        .upload-zone strong { color: var(--dark); }

        .preview-table { font-size: 0.85rem; }
        .preview-table th, .preview-table td { padding: 6px 10px; }

        .col-mapper {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
        }
        .col-mapper label { font-weight: 600; color: var(--dark); }

        .stmt-card {
            cursor: pointer;
            transition: 0.2s;
        }
        .stmt-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

        .merchant-cell {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gray-dark);
            font-size: 0.92rem;
            margin-bottom: 14px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
        }
        .back-link:hover { color: var(--primary); }
        .back-link svg { width: 16px; height: 16px; }

        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--gray-dark);
            margin-left: 6px;
        }
        .stat-pill strong { color: var(--dark); }

        .file-input { display: none; }
    </style>
</head>
<body>
    <div class="splash" id="splash"><img src="images/Omri's%20Software%20%E2%80%93%20Logo.png" alt="טוען..."></div>
    <div id="appHeader"></div>

    <div class="page-title-bar">
        <div class="container">
            <h2 id="pageTitle">כלל דפים</h2>
            <div class="subtitle" id="pageSubtitle">העלה קובץ אקסל או PDF (חשבונות, דפי אשראי, מים, חשמל וכו'). המערכת תחלץ עסקאות מאקסל אוטומטית.</div>
        </div>
    </div>

    <main class="container">
        <!-- LIST VIEW -->
        <div id="listView">
            <div class="toolbar">
                <div style="color:var(--gray-dark);font-size:0.88rem">תומך ב-Excel (חילוץ עסקאות אוטומטי) או PDF</div>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()" id="uploadBtn">העלה אקסל / PDF</button>
                <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls,.csv,.pdf,application/pdf" onchange="handleFileSelected(event)">
            </div>

            <div id="statementsContainer"></div>
        </div>

        <!-- DETAIL VIEW (one statement) -->
        <div id="detailView" style="display:none">
            <button class="back-link" onclick="showList()" id="backBtn">חזרה לרשימה</button>
            <div class="card">
                <div class="card-header">
                    <div>
                        <h3 class="card-title" id="detailTitle"></h3>
                        <div id="detailMeta" style="margin-top:8px"></div>
                    </div>
                    <div id="detailActions" style="display:flex;gap:6px;flex-wrap:wrap"></div>
                </div>
                <div id="transactionsContainer"></div>
            </div>
        </div>
    </main>

    <!-- Upload preview modal -->
    <div class="modal-backdrop" id="uploadModal">
        <div class="modal" style="max-width:780px">
            <div class="modal-header">
                <div class="modal-title">תצוגה מקדימה לפני שמירה</div>
                <button class="modal-close" onclick="closeUploadModal()" id="closeUpBtn"></button>
            </div>

            <div id="uploadFormContent">
                <div class="form-group">
                    <label class="form-label">שם הדף <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="stmtName" class="form-input" placeholder="לדוגמה: חשבון חשמל - מאי 2026" required>
                </div>

                <div id="parseStats" style="margin:10px 0"></div>

                <!-- Hidden inputs kept for backward compatibility -->
                <input type="hidden" id="stmtCompany" value="">
                <input type="hidden" id="stmtMonth" value="">
                <input type="hidden" id="stmtLast4" value="">
                <div id="colMapper" style="display:none"></div>
                <table id="previewTable" style="display:none"></table>

                <div id="uploadError" style="color:var(--danger);font-size:0.9rem;margin:10px 0;display:none"></div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="saveStatement()" id="saveStmtBtn">שמירה</button>
                    <button type="button" class="btn btn-danger" style="background:#dc2626;color:white;border-color:#dc2626" onclick="closeUploadModal()">ביטול</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=49"></script>
    <script>
        document.getElementById('uploadBtn').innerHTML = ICONS.plus + '<span>העלה אקסל / PDF</span>';
        document.getElementById('closeUpBtn').innerHTML = ICONS.close;
        document.getElementById('backBtn').innerHTML = ICONS.arrowLeft + '<span>חזרה לרשימה</span>';

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
        }

        let statementsData = [];
        let currentStatement = null;
        let parsedRows = []; // raw rows from Excel
        let detectedHeaders = []; // column headers detected
        let columnMapping = { date: -1, merchant: -1, amount: -1, notes: -1, installment: -1 };
        let editMode = false;
        let editedTxns = []; // working copy when in edit mode (legacy transactions)
        let editedSheetHeaders = []; // working copy of headers when editing generic sheet
        let editedSheetRows = []; // working copy of rows when editing generic sheet

        // ===== List view =====

        function renderList() {
            const container = document.getElementById('statementsContainer');
            try {
            if (!statementsData || statementsData.length === 0) {
                container.innerHTML = `
                    <div class="upload-zone" onclick="document.getElementById('fileInput').click()" id="uploadZone" style="margin-top:14px">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <div><strong>גרור קובץ אקסל או PDF לכאן</strong> או לחץ לבחירה</div>
                        <div style="font-size:0.85rem;margin-top:4px">פורמטים נתמכים: .xlsx, .xls, .csv, .pdf</div>
                    </div>`;
                wireDropZone();
                return;
            }

            const sorted = [...statementsData].sort((a, b) => {
                const ta = a.createdAt ? (a.createdAt.toMillis ? a.createdAt.toMillis() : 0) : 0;
                const tb = b.createdAt ? (b.createdAt.toMillis ? b.createdAt.toMillis() : 0) : 0;
                return tb - ta;
            });
            container.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px">
                ${sorted.map(s => {
                    const isPdf = s.fileType === 'application/pdf';
                    const hasSheet = Array.isArray(s.sheetHeaders) && Array.isArray(s.sheetRows);
                    const total = (s.transactions || []).reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
                    const count = (s.transactions || []).length;
                    let bodyHtml;
                    if (isPdf) {
                        bodyHtml = '<div style="font-size:1.05rem;font-weight:700;color:var(--dark);display:flex;align-items:center;gap:6px"><span style="font-size:1.4rem">📄</span> PDF</div><div style="color:var(--gray-dark);font-size:0.85rem">קובץ מצורף</div>';
                    } else if (hasSheet) {
                        bodyHtml = `<div style="font-size:1.05rem;font-weight:700;color:var(--dark);display:flex;align-items:center;gap:6px"><span style="font-size:1.4rem">📊</span> אקסל</div><div style="color:var(--gray-dark);font-size:0.85rem">${s.sheetRows.length} שורות · ${s.sheetHeaders.length} עמודות</div>`;
                    } else {
                        bodyHtml = `<div style="font-size:1.6rem;font-weight:700;color:var(--dark)">${fmtCurrency(total)}</div><div style="color:var(--gray-dark);font-size:0.85rem">${count} עסקאות</div>`;
                    }
                    return `
                    <div class="card stmt-card" onclick="showDetail('${s.id}')" style="margin-bottom:0">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start">
                            <div style="flex:1;min-width:0">
                                <h3 style="font-size:1.05rem;color:var(--dark);font-weight:700;margin-bottom:4px;word-break:break-word">${escapeHtml(s.name || 'ללא שם')}</h3>
                            </div>
                        </div>
                        <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
                            <div>${bodyHtml}</div>
                            <div style="color:var(--gray)">${ICONS.arrowLeft}</div>
                        </div>
                    </div>`;
                }).join('')}
            </div>`;
            } catch (err) {
                console.error('renderList error:', err);
                container.innerHTML = `<div class="empty-state" style="color:var(--danger)"><h3>שגיאה בהצגת הרשימה</h3><p>${escapeHtml(err.message || String(err))}</p></div>`;
            }
        }

        function getCompanyBadge(company) {
            const types = {
                // New file-type categories
                credit: { label: 'אשראי', color: '#1a1f71' },
                electricity: { label: 'חשמל', color: '#f59e0b' },
                water: { label: 'מים', color: '#0284c7' },
                gas: { label: 'גז', color: '#dc2626' },
                arnona: { label: 'ארנונה', color: '#7c3aed' },
                vaad: { label: 'ועד בית', color: '#0d9488' },
                internet: { label: 'אינטרנט', color: '#2563eb' },
                phone: { label: 'סלולר', color: '#059669' },
                tv: { label: 'טלוויזיה', color: '#9333ea' },
                insurance: { label: 'ביטוח', color: '#475569' },
                mortgage: { label: 'משכנתא', color: '#92400e' },
                rent: { label: 'שכר דירה', color: '#b45309' },
                bank: { label: 'בנק', color: '#166534' },
                subscription: { label: 'מנויים', color: '#be185d' },
                // Legacy credit card brand values (kept for backward compatibility)
                visa: { label: 'Visa', color: '#1a1f71' },
                mastercard: { label: 'Mastercard', color: '#eb001b' },
                amex: { label: 'AmEx', color: '#006fcf' },
                isracard: { label: 'ישראכרט', color: '#d62828' },
                cal: { label: 'כאל', color: '#00509d' },
                max: { label: 'Max', color: '#5a189a' },
                other: { label: 'אחר', color: 'var(--gray)' },
            };
            const c = types[company] || { label: '', color: 'var(--gray)' };
            if (!c.label) return '';
            return `<span style="background:${c.color};color:white;padding:3px 10px;border-radius:6px;font-size:0.72rem;font-weight:600">${c.label}</span>`;
        }

        function formatYM(ym) {
            if (!ym) return '';
            const [y, m] = ym.split('-');
            const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
            return months[parseInt(m,10)-1] + ' ' + y;
        }

        // ===== Sheet totals (auto-calculate sums per column + income/expense detection) =====

        function classifyColumn(header) {
            const h = String(header || '').toLowerCase();
            if (/הכנס|הכנסה|הכנסות|רווח|משכורת|שכר[^\s]*דירה|ind|income|revenue|profit|salary/.test(h) && !/הוצא|expense|cost/.test(h)) {
                // Note: 'שכר דירה' (rent) is an expense, not income — exclude it
                if (/שכר דירה|שכר־דירה|שכ"ד|שכ״ד/.test(h)) return 'expense';
                return 'income';
            }
            if (/הוצא|הוצאה|הוצאות|תשלום|תשלומים|חשבון|expense|expenses|cost|costs|payment|bill/.test(h)) return 'expense';
            return 'other';
        }

        function parseNumericValue(raw) {
            if (raw === null || raw === undefined || raw === '') return NaN;
            const cleaned = String(raw).replace(/[₪$,\s]/g, '').replace(/[()]/g, '');
            const n = parseFloat(cleaned);
            return isNaN(n) ? NaN : n;
        }

        function computeSheetTotals(headers, rows) {
            // Returns: { columnTotals: [{header, sum, count, kind}], income, expense, balance, hasNumeric }
            const columnTotals = headers.map((h, ci) => {
                let sum = 0;
                let numericCount = 0;
                let textCount = 0;
                for (const r of rows) {
                    const vals = (r && r.values) || (Array.isArray(r) ? r : []);
                    const raw = vals[ci];
                    if (raw === '' || raw === null || raw === undefined) continue;
                    const n = parseNumericValue(raw);
                    if (!isNaN(n)) {
                        sum += n;
                        numericCount++;
                    } else {
                        textCount++;
                    }
                }
                return { header: h, sum, count: numericCount, textCount, kind: classifyColumn(h) };
            });

            // A column is "numeric" only if MOST of its non-empty values are numbers.
            // This avoids treating a names/labels column with one stray number as numeric.
            const numericCols = columnTotals.filter(c => c.count > 0 && c.count > c.textCount);
            const income = numericCols.filter(c => c.kind === 'income').reduce((s, c) => s + c.sum, 0);
            const expense = numericCols.filter(c => c.kind === 'expense').reduce((s, c) => s + c.sum, 0);
            return {
                columnTotals: numericCols,
                income,
                expense,
                balance: income - expense,
                hasIncome: numericCols.some(c => c.kind === 'income'),
                hasExpense: numericCols.some(c => c.kind === 'expense'),
                hasNumeric: numericCols.length > 0,
            };
        }

        function renderSheetTotalsBar(totals, sheetRowsLength, sheetColsLength) {
            // Top bar shows ONLY row/column counts. Sums appear in the totals row at the bottom of the table.
            return `
                <span class="stat-pill">שורות: <strong>${sheetRowsLength}</strong></span>
                <span class="stat-pill">עמודות: <strong>${sheetColsLength}</strong></span>
            `;
        }

        function renderTotalsRow(headers, totals) {
            // Per-column sums: each numeric column shows its own sum below it.
            // "סה"כ" label appears in column 0 (if column 0 itself is not numeric).
            const colMap = new Map(totals.columnTotals.map(c => [c.header, c]));
            const col0IsNumeric = !!colMap.get(headers[0]);
            return `<tr style="background:var(--light-2);font-weight:600">
                ${headers.map((h, idx) => {
                    const col = colMap.get(h);
                    // Column 0 special case: place "סה"כ" label there if it's a text column
                    if (idx === 0 && !col0IsNumeric) return '<td><strong>סה"כ</strong></td>';
                    if (col) {
                        // Numeric column: show its sum (with "סה"כ:" prefix if column 0 is also numeric and idx===0)
                        const prefix = (idx === 0 && col0IsNumeric) ? '<strong>סה"כ:</strong> ' : '';
                        return `<td style="white-space:nowrap;color:var(--primary)">${prefix}${fmtCurrency(col.sum)}</td>`;
                    }
                    return '<td></td>';
                }).join('')}
            </tr>`;
        }

        // ===== Detail view =====

        function showDetail(id) {
            const s = statementsData.find(x => x.id === id);
            if (!s) return;
            currentStatement = s;
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            document.getElementById('pageTitle').textContent = s.name || 'דף';
            document.getElementById('pageSubtitle').textContent = (s.month ? formatYM(s.month) : '') + (s.last4 ? ' · ••' + s.last4 : '');

            const isPdf = s.fileType === 'application/pdf' && s.fileData;
            const actionsEl = document.getElementById('detailActions');

            if (isPdf) {
                document.getElementById('detailTitle').textContent = 'קובץ PDF';
                document.getElementById('detailMeta').innerHTML = `
                    ${s.company ? `<span class="stat-pill">סוג: <strong>${escapeHtml(getCompanyName(s.company))}</strong></span>` : ''}
                    <span class="stat-pill">קובץ: <strong>${escapeHtml(s.fileName || 'PDF')}</strong></span>
                    <span class="stat-pill">גודל: <strong>${((s.fileSize || 0) / 1024).toFixed(0)} KB</strong></span>
                `;
                actionsEl.innerHTML = `
                    <button class="btn btn-outline btn-sm" onclick="downloadStatementPdf('${s.id}')">${ICONS.arrowLeft}<span>הורד PDF</span></button>
                    <button class="btn btn-outline btn-sm" onclick="deleteCurrentStatement()">${ICONS.trash}<span>מחק דף</span></button>
                `;
                document.getElementById('transactionsContainer').innerHTML = `
                    <div style="margin-top:8px">
                        <iframe src="${s.fileData}" style="width:100%;height:75vh;min-height:500px;border:1px solid var(--border);border-radius:var(--radius-sm)"></iframe>
                    </div>`;
                return;
            }

            // Decide which mode: generic spreadsheet (preferred) or legacy transactions
            const hasSheet = Array.isArray(s.sheetHeaders) && Array.isArray(s.sheetRows);

            document.getElementById('detailTitle').textContent = editMode ? 'עריכת קובץ' : 'תוכן הקובץ';

            // ===== EDIT MODE =====
            if (editMode) {
                actionsEl.innerHTML = `
                    <button class="btn btn-success btn-sm" onclick="saveEditedTransactions()" id="saveEditBtn">${ICONS.check}<span>שמירה</span></button>
                    <button class="btn btn-danger btn-sm" onclick="cancelEdit()">${ICONS.close}<span>ביטול</span></button>
                `;
                if (hasSheet || (Array.isArray(editedSheetRows) && editedSheetRows.length > 0) || (Array.isArray(editedSheetHeaders) && editedSheetHeaders.length > 0)) {
                    renderEditableSheet();
                } else {
                    renderEditableTransactions();
                }
                return;
            }

            // ===== READ-ONLY MODE =====

            // Generic spreadsheet view (when sheetRows present)
            if (hasSheet) {
                const headers = s.sheetHeaders;
                const rows = s.sheetRows;
                const totals = computeSheetTotals(headers, rows);
                document.getElementById('detailMeta').innerHTML = renderSheetTotalsBar(totals, rows.length, headers.length);
                actionsEl.innerHTML = `
                    <button class="btn btn-primary btn-sm" onclick="enterEditMode()">${ICONS.edit}<span>ערוך קובץ</span></button>
                    <button class="btn btn-outline btn-sm" onclick="deleteCurrentStatement()">${ICONS.trash}<span>מחק דף</span></button>
                `;
                const container = document.getElementById('transactionsContainer');
                if (rows.length === 0) {
                    container.innerHTML = `<div class="empty-state"><h3>הקובץ ריק</h3><p>לחץ על "ערוך קובץ" כדי להוסיף שורות</p></div>`;
                    return;
                }
                const totalsRowHtml = totals.hasNumeric ? renderTotalsRow(headers, totals) : '';
                container.innerHTML = `
                    <div style="overflow-x:auto">
                    <table class="data-table">
                        <thead>
                            <tr>${headers.map(h => `<th>${escapeHtml(h || '—')}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                            ${rows.map(r => {
                                const vals = (r && r.values) || [];
                                return `<tr>${headers.map((_, idx) => `<td>${escapeHtml(vals[idx] ?? '')}</td>`).join('')}</tr>`;
                            }).join('')}
                            ${totalsRowHtml}
                        </tbody>
                    </table>
                    </div>`;
                return;
            }

            // Legacy transactions view (only if no sheet data)
            const txns = s.transactions || [];
            document.getElementById('detailMeta').innerHTML = `
                <span class="stat-pill">עסקאות: <strong>${txns.length}</strong></span>
            `;

            actionsEl.innerHTML = `
                <button class="btn btn-primary btn-sm" onclick="enterEditMode()">${ICONS.edit}<span>ערוך עסקאות</span></button>
                <button class="btn btn-outline btn-sm" onclick="deleteCurrentStatement()">${ICONS.trash}<span>מחק דף</span></button>
            `;

            const container = document.getElementById('transactionsContainer');
            if (txns.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>אין עסקאות בדף הזה</h3><p>לחץ על "ערוך עסקאות" כדי להוסיף ידנית</p></div>`;
                return;
            }

            const sortedTxns = [...txns].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            container.innerHTML = `
                <div style="overflow-x:auto">
                <table class="data-table">
                    <thead>
                        <tr><th>תאריך</th><th>בית עסק</th><th>סכום</th><th>תשלומים</th><th>הערות</th></tr>
                    </thead>
                    <tbody>
                        ${sortedTxns.map(t => `
                            <tr>
                                <td style="white-space:nowrap">${escapeHtml(formatDate(t.date))}</td>

        async function saveEditedTransactions() {
            if (!currentStatement) return;
            const btn = document.getElementById('saveEditBtn');
            if (btn) { btn.disabled = true; btn.innerHTML = ICONS.check + '<span>שמירה...</span>'; }
            try {
                const editingSheet = editedSheetHeaders.length > 0 || editedSheetRows.length > 0
                    || (Array.isArray(currentStatement.sheetHeaders) && Array.isArray(currentStatement.sheetRows));

                if (editingSheet) {
                    const headers = editedSheetHeaders.map(h => String(h ?? ''));
                    // Wrap each row in { values: [...] } object — Firestore disallows nested arrays
                    const rows = editedSheetRows
                        .map(r => ({ values: headers.map((_, ci) => String(r[ci] ?? '')) }))
                        .filter(r => r.values.some(v => String(v).trim() !== ''));
                    await Statements.update(currentStatement.id, {
                        sheetHeaders: headers,
                        sheetRows: rows,
                    });
                } else {
                    const cleaned = editedTxns.map(t => ({
                        date: t.date || '',
                        merchant: t.merchant || '',
                        amount: Number(t.amount) || 0,
                        installment: t.installment || '',
                        notes: t.notes || '',
                    })).filter(t => t.date || t.merchant || t.amount);
                    const totalAmount = cleaned.reduce((s, t) => s + (Number(t.amount) || 0), 0);
                    await Statements.update(currentStatement.id, {
                        transactions: cleaned,
                        transactionCount: cleaned.length,
                        totalAmount: totalAmount,
                    });
                }
                editMode = false;
                editedTxns = [];
                editedSheetHeaders = [];
                editedSheetRows = [];
                if (currentStatement) showDetail(currentStatement.id);
            } catch (err) {
                showAlert('שגיאה בשמירה: ' + err.message);
                if (btn) { btn.disabled = false; btn.innerHTML = ICONS.check + '<span>שמירה</span>'; }
            }
        }

        // ===== File upload + parse =====

        function wireDropZone() {
            const zone = document.getElementById('uploadZone');
            if (!zone) return;
            ['dragenter', 'dragover'].forEach(e => zone.addEventListener(e, ev => {
                ev.preventDefault(); ev.stopPropagation();
                zone.classList.add('dragover');
            }));
            ['dragleave', 'drop'].forEach(e => zone.addEventListener(e, ev => {
                ev.preventDefault(); ev.stopPropagation();
                zone.classList.remove('dragover');
            }));
            zone.addEventListener('drop', (ev) => {
                if (ev.dataTransfer.files && ev.dataTransfer.files[0]) {
                    handleFile(ev.dataTransfer.files[0]);
                }
            });
        }

        function handleFileSelected(e) {
            const file = e.target.files[0];
            if (file) handleFile(file);
            e.target.value = ''; // allow re-uploading same file
        }

        let pdfFile = null; // { dataUrl, name, size }

        async function handleFile(file) {
            try {
                const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);

                // Default name from filename
                const nameInput = document.getElementById('stmtName');
                if (!nameInput.value) {
                    nameInput.value = file.name.replace(/\.[^/.]+$/, '');
                }
                const monthInput = document.getElementById('stmtMonth');
                if (!monthInput.value) monthInput.value = currentYM();

                if (isPdf) {
                    if (file.size > 800 * 1024) {
                        showAlert('PDF גדול מדי - עד 800KB. נסה לדחוס/לפצל את הקובץ.');
                        return;
                    }
                    const dataUrl = await new Promise((resolve, reject) => {
                        const r = new FileReader();
                        r.onload = (e) => resolve(e.target.result);
                        r.onerror = reject;
                        r.readAsDataURL(file);
                    });
                    pdfFile = { dataUrl, name: file.name, size: file.size };
                    parsedRows = [];
                    detectedHeaders = [];
                    columnMapping = { date: -1, merchant: -1, amount: -1, notes: -1, installment: -1 };
                    renderPdfPreview();
                    openModal('uploadModal');
                    return;
                }

                // Excel/CSV branch
                pdfFile = null;
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });

                if (rows.length < 2) {
                    showAlert('הקובץ ריק או לא תקין');
                    return;
                }

                const { headerIdx, headers } = detectHeaderRow(rows);
                detectedHeaders = headers;
                parsedRows = rows.slice(headerIdx + 1).filter(r =>
                    r.some(cell => cell !== null && cell !== undefined && String(cell).trim() !== '')
                );
                columnMapping = autoDetectColumns(headers);

                renderColumnMapper();
                renderPreview();
                openModal('uploadModal');
            } catch (err) {
                console.error('Parse error:', err);
                showAlert('שגיאה בקריאת הקובץ: ' + err.message);
            }
        }

        function renderPdfPreview() {
            // Hide Excel-specific UI
            document.getElementById('colMapper').innerHTML = `
                <div style="background:var(--light-2);padding:12px;border-radius:var(--radius-sm);color:var(--gray-dark);font-size:0.92rem">
                    קובץ PDF זוהה. הקובץ יישמר במלואו - לא נחלץ ממנו עסקאות אוטומטית.
                </div>`;
            document.getElementById('previewTable').innerHTML = '';
            document.getElementById('parseStats').innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--light-2);border-radius:var(--radius-sm)">
                    <div style="font-size:1.8rem">📄</div>
                    <div>
                        <div style="font-weight:600;color:var(--dark)">${escapeHtml(pdfFile.name)}</div>
                        <div style="font-size:0.85rem">PDF · ${(pdfFile.size/1024).toFixed(0)} KB</div>
                    </div>
                </div>`;
        }

        function detectHeaderRow(rows) {
            // Look for row that has text-like content (likely headers)
            // Prefer rows containing common Hebrew header words
            const keywords = ['תאריך', 'סכום', 'בית עסק', 'ספק', 'date', 'amount', 'merchant', 'description', 'פרטים'];
            for (let i = 0; i < Math.min(20, rows.length); i++) {
                const row = rows[i];
                const text = row.map(c => String(c).toLowerCase()).join(' ');
                if (keywords.some(kw => text.includes(kw.toLowerCase()))) {
                    return { headerIdx: i, headers: row.map(c => String(c).trim()) };
                }
            }
            // Fallback: assume first row is headers
            return { headerIdx: 0, headers: rows[0].map(c => String(c).trim()) };
        }

        function autoDetectColumns(headers) {
            const map = { date: -1, merchant: -1, amount: -1, notes: -1, installment: -1 };
            const lc = headers.map(h => String(h).toLowerCase());

            const find = (patterns) => {
                for (let i = 0; i < lc.length; i++) {
                    if (patterns.some(p => lc[i].includes(p))) return i;
                }
                return -1;
            };

            map.date = find(['תאריך עסקה', 'תאריך רכישה', 'תאריך', 'date']);
            map.merchant = find(['שם בית עסק', 'בית העסק', 'בית עסק', 'ספק', 'תיאור', 'פרטים', 'merchant', 'description']);
            map.amount = find(['סכום חיוב', 'סכום עסקה', 'סכום בש"ח', 'סכום', 'amount', 'total']);
            map.installment = find(['תשלום', 'תשלומים', 'מספר תשלום', 'installment']);
            map.notes = find(['הערה', 'הערות', 'note', 'comment']);

            return map;
        }

        function renderColumnMapper() {
            const fields = [
                { key: 'date', label: 'תאריך *' },
                { key: 'merchant', label: 'בית עסק *' },
                { key: 'amount', label: 'סכום *' },
                { key: 'installment', label: 'תשלומים' },
                { key: 'notes', label: 'הערות' },
            ];

            const optionsHtml = '<option value="-1">— לא קיים —</option>' +
                detectedHeaders.map((h, i) => `<option value="${i}">${escapeHtml(h || '(ריק)')}</option>`).join('');

            document.getElementById('colMapper').innerHTML = fields.map(f => `
                <div class="col-mapper">
                    <label>${f.label}</label>
                    <select class="form-select" data-field="${f.key}" onchange="onColumnChange(this)">
                        ${optionsHtml.replace(`value="${columnMapping[f.key]}"`, `value="${columnMapping[f.key]}" selected`)}
                    </select>
                </div>
            `).join('');
        }

        function onColumnChange(sel) {
            const field = sel.dataset.field;
            columnMapping[field] = parseInt(sel.value, 10);
            renderPreview();
        }

        function renderPreview() {
            const transactions = parseTransactions();
            const total = transactions.reduce((s, t) => s + (Number(t.amount) || 0), 0);
            const stats = document.getElementById('parseStats');
            if (transactions.length > 0) {
                stats.innerHTML = `
                    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(67,160,71,0.1);border-radius:var(--radius-sm);color:var(--dark)">
                        <div style="font-size:1.6rem">📊</div>
                        <div>
                            <div style="font-weight:600">${transactions.length} עסקאות זוהו</div>
                            <div style="font-size:0.85rem;color:var(--gray-dark)">סך הכל: ${fmtCurrency(total)}</div>
                        </div>
                    </div>`;
            } else {
                stats.innerHTML = `
                    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--light-2);border-radius:var(--radius-sm);color:var(--gray-dark)">
                        <div style="font-size:1.6rem">📄</div>
                        <div>
                            <div style="font-weight:600;color:var(--dark)">קובץ זוהה</div>
                            <div style="font-size:0.85rem">הקובץ יישמר. תוכל לערוך עסקאות ידנית בדף.</div>
                        </div>
                    </div>`;
            }
        }

        function parseTransactions() {
            const out = [];
            for (const row of parsedRows) {
                const get = (idx) => idx < 0 || idx >= row.length ? '' : (row[idx] === null || row[idx] === undefined ? '' : String(row[idx]).trim());

                const dateRaw = get(columnMapping.date);
                const merchant = get(columnMapping.merchant);
                const amountRaw = get(columnMapping.amount);
                const installment = get(columnMapping.installment);
                const notes = get(columnMapping.notes);

                if (!merchant && !amountRaw && !dateRaw) continue;

                const amount = parseAmount(amountRaw);
                const date = parseDate(dateRaw);

                out.push({
                    date: date,
                    merchant: merchant,
                    amount: amount,
                    installment: installment,
                    notes: notes,
                });
            }
            return out;
        }

        function parseAmount(raw) {
            if (!raw) return 0;
            const cleaned = String(raw).replace(/[₪$,\s]/g, '').replace(/[()]/g, '');
            const n = parseFloat(cleaned);
            return isNaN(n) ? 0 : n;
        }

        function parseDate(raw) {
            if (!raw) return '';
            // Try DD/MM/YYYY or DD/MM/YY
            const m = String(raw).match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
            if (m) {
                let [, d, mo, y] = m;
                if (y.length === 2) y = '20' + y;
                return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
            }
            const dt = new Date(raw);
            if (!isNaN(dt)) return dt.toISOString().slice(0, 10);
            return String(raw);
        }

        async function saveStatement() {
            const errEl = document.getElementById('uploadError');
            errEl.style.display = 'none';

            const name = document.getElementById('stmtName').value.trim();
            if (!name) {
                errEl.textContent = 'חובה להזין שם לדף';
                errEl.style.display = 'block';
                return;
            }

            const isPdf = !!pdfFile;
            let payload = {
                name,
                company: document.getElementById('stmtCompany').value || '',
                month: document.getElementById('stmtMonth').value || '',
                last4: document.getElementById('stmtLast4').value.trim() || '',
            };

            if (isPdf) {
                payload.transactions = [];
                payload.transactionCount = 0;
                payload.totalAmount = 0;
                payload.fileData = pdfFile.dataUrl;
                payload.fileType = 'application/pdf';
                payload.fileName = pdfFile.name;
                payload.fileSize = pdfFile.size;
            } else {
                // Save the RAW spreadsheet data (headers + all rows) so it can be edited later.
                // Firestore does NOT allow nested arrays, so each row is wrapped in an object: { values: [...] }
                const cleanHeaders = (detectedHeaders || []).map(h => String(h ?? '').trim());
                const cleanRows = (parsedRows || []).map(r => ({
                    values: cleanHeaders.map((_, idx) => {
                        const v = r[idx];
                        if (v === null || v === undefined) return '';
                        if (v instanceof Date) return v.toISOString().slice(0,10);
                        return String(v);
                    })
                }));
                payload.sheetHeaders = cleanHeaders;
                payload.sheetRows = cleanRows;

                // Also keep auto-detected transactions for backward compat / dashboard total
                let transactions = [];
                if (columnMapping.date >= 0 || columnMapping.merchant >= 0 || columnMapping.amount >= 0) {
                    transactions = parseTransactions();
                }
                payload.transactions = transactions;
                payload.transactionCount = transactions.length;
                payload.totalAmount = transactions.reduce((s, t) => s + (Number(t.amount) || 0), 0);
            }

            // Estimate Firestore document size (limit is 1MB)
            try {
                const sizeBytes = new Blob([JSON.stringify(payload)]).size;
                if (sizeBytes > 950 * 1024) {
                    errEl.innerHTML = `הקובץ גדול מדי לשמירה (${(sizeBytes/1024).toFixed(0)}KB > 950KB).<br>נסה להפחית מספר שורות/עמודות באקסל לפני העלאה.`;
                    errEl.style.display = 'block';
                    return;
                }
            } catch (_) { /* ignore size check failure */ }

            const btn = document.getElementById('saveStmtBtn');
            btn.disabled = true;
            btn.textContent = 'שמירה...';

            try {
                await Statements.add(payload);
                closeUploadModal();
            } catch (err) {
                console.error('save error', err);
                errEl.textContent = 'שגיאה בשמירה: ' + (err.message || err);
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'שמירה';
            }
        }

        function closeUploadModal() {
            closeModal('uploadModal');
            document.getElementById('stmtName').value = '';
            document.getElementById('stmtCompany').value = '';
            document.getElementById('stmtMonth').value = '';
            document.getElementById('stmtLast4').value = '';
            parsedRows = [];
            detectedHeaders = [];
            columnMapping = { date: -1, merchant: -1, amount: -1, notes: -1, installment: -1 };
            pdfFile = null;
        }

        function downloadStatementPdf(id) {
            const s = statementsData.find(x => x.id === id);
            if (!s || !s.fileData) return;
            const a = document.createElement('a');
            a.href = s.fileData;
            a.download = s.fileName || (s.name + '.pdf');
            a.click();
        }

        // Initial loading placeholder so the page doesn't appear blank before data arrives
        document.getElementById('statementsContainer').innerHTML =
            '<div class="empty-state" style="padding:40px"><h3>טוען...</h3></div>';

        document.addEventListener('auth:ready', () => {
            Statements.subscribe(items => {
                statementsData = items || [];
                if (currentStatement) {
                    const updated = statementsData.find(s => s.id === currentStatement.id);
                    if (updated) {
                        currentStatement = updated;
                        showDetail(updated.id);
                    } else {
                        showList();
                    }
                } else {
                    renderList();
                }
            });
        });
    </script>
</body>
</html>
