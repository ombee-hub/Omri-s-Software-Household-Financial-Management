<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="theme-color" content="#6b2f5a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="החתונה שלנו">
    <link rel="manifest" href="pwa/manifest.json">
    <link rel="apple-touch-icon" href="images/heart-icon.png">
    <link rel="icon" type="image/png" href="images/heart-icon.png">
    <title>החתונה שלנו - תקציב וספקים</title>
    <link rel="stylesheet" href="css/app.css?v=50">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body>
    <div class="splash" id="splash"><div class="splash-heart"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div></div>
    <div id="appHeader"></div>

    <div class="page-title-bar">
        <div class="container">
            <h2>תקציב וספקים</h2>
            <div class="subtitle">כל ההוצאות והספקים במקום אחד: כמה עולה, כמה שולם ומה נשאר. קייטרינג אפשר לתמחר לפי מנה, והמחיר יתעדכן לפי צפי ההגעה.</div>
        </div>
    </div>

    <main class="container">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="charts-grid">
            <div class="card">
                <div class="card-header"><h3 class="card-title">לפי קטגוריה</h3></div>
                <div class="chart-sub">עלות מתוכננת</div>
                <div id="catChart"></div>
            </div>
            <div class="card">
                <div class="card-header"><h3 class="card-title">מצב תשלומים</h3></div>
                <div class="chart-sub" id="payChartSub"></div>
                <div id="payChart"></div>
                <div id="budgetUse" style="margin-top:20px"></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-actions">
                <button class="btn btn-primary" onclick="openExpenseModal()" id="addBtn"></button>
                <button class="btn btn-outline" onclick="exportExpenses()" id="exportBtn"></button>
            </div>
        </div>

        <div class="card">
            <div class="filters-bar">
                <select id="filterCat" class="form-select" onchange="render()"><option value="">כל הקטגוריות</option></select>
                <select id="filterPay" class="form-select" onchange="render()">
                    <option value="">כל התשלומים</option>
                    <option value="open">נשאר לשלם</option>
                    <option value="done">שולם במלואו</option>
                </select>
            </div>
            <div id="expensesContainer"></div>
        </div>
    </main>

    <div class="modal-backdrop" id="expenseModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="expenseModalTitle">הוספת הוצאה</div>
                <button class="modal-close" onclick="closeModal('expenseModal')" data-icon="close"></button>
            </div>
            <form id="expenseForm" onsubmit="saveExpense(event)">
                <input type="hidden" id="expenseId">
                <div class="form-group">
                    <label class="form-label">מה <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="eName" class="form-input" placeholder="לדוגמה: אולם, צלם, DJ" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">קטגוריה</label>
                        <select id="eCategory" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">שם הספק</label>
                        <input type="text" id="eVendor" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">טלפון ספק</label>
                    <input type="tel" id="ePhone" class="form-input" dir="ltr" style="text-align:right">
                </div>
                <label style="display:flex;gap:8px;align-items:center;font-size:0.92rem;margin-bottom:12px;cursor:pointer">
                    <input type="checkbox" id="ePerGuest" onchange="syncPriceFields()"> מחיר לפי מנה (כפול צפי המגיעים)
                </label>
                <div class="form-row">
                    <div class="form-group" id="eTotalGroup">
                        <label class="form-label">מחיר כולל (₪)</label>
                        <input type="number" id="eTotal" class="form-input" min="0" step="0.01">
                    </div>
                    <div class="form-group" id="eUnitGroup" style="display:none">
                        <label class="form-label">מחיר למנה (₪)</label>
                        <input type="number" id="eUnit" class="form-input" min="0" step="0.01" oninput="syncPriceFields()">
                        <div class="form-hint" id="eUnitHint"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">שולם עד עכשיו (₪)</label>
                        <input type="number" id="ePaid" class="form-input" min="0" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">תאריך התשלום הבא</label>
                    <input type="date" id="eDue" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">הערות</label>
                    <textarea id="eNotes" class="form-textarea" style="min-height:60px"></textarea>
                </div>
                <div id="expenseError" style="color:var(--danger);font-size:0.9rem;margin-bottom:10px;display:none"></div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">שמירה</button>
                    <button type="button" class="btn btn-outline" onclick="closeModal('expenseModal')">ביטול</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-backdrop" id="payModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">רישום תשלום</div>
                <button class="modal-close" onclick="closeModal('payModal')" data-icon="close"></button>
            </div>
            <form onsubmit="confirmPayment(event)">
                <input type="hidden" id="payId">
                <div id="payInfo" class="info-box" style="margin-bottom:14px"></div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">סכום ששולם עכשיו (₪)</label>
                        <input type="number" id="payAmount" class="form-input" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">תאריך התשלום הבא (אם יש)</label>
                        <input type="date" id="payNextDue" class="form-input">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">שמירה</button>
                    <button type="button" class="btn btn-outline" onclick="closeModal('payModal')">ביטול</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js?v=83"></script>
    <script>
        document.getElementById('addBtn').innerHTML = ICONS.plus + '<span>הוספת הוצאה / ספק</span>';
        document.getElementById('exportBtn').innerHTML = ICONS.download + '<span>ייצוא לאקסל</span>';
        document.querySelectorAll('[data-icon="close"]').forEach(b => b.innerHTML = ICONS.close);

        const catOpts = EXPENSE_CATEGORIES.map(c => `<option value="${c.value}">${c.label}</option>`).join('');
        document.getElementById('eCategory').innerHTML = catOpts;
        document.getElementById('filterCat').innerHTML += catOpts;

        let expensesData = [];
        let guestsData = [];

        function expectedGuests() { return guestCounts(guestsData).expected; }

        function withTotals(e) {
            const total = expenseTotal(e, expectedGuests());
            const paid = Number(e.paid) || 0;
            return { ...e, _total: total, _paid: paid, _remaining: Math.max(0, total - paid) };
        }

        function payBadge(e) {
            if (e._total > 0 && e._paid >= e._total) return '<span class="badge badge-success">שולם במלואו</span>';
            if (e._paid > 0) return '<span class="badge badge-info">שולמה מקדמה</span>';
            return '<span class="badge badge-gray">לא שולם</span>';
        }

        function renderSummary(items) {
            const total = items.reduce((s, e) => s + e._total, 0);
            const paid = items.reduce((s, e) => s + Math.min(e._paid, e._total || e._paid), 0);
            const remaining = items.reduce((s, e) => s + e._remaining, 0);
            const budget = Number(weddingSettings.totalBudget) || 0;
            const card = (cls, icon, num, title) => `<div class="stat-card ${cls}"><div class="stat-icon">${icon}</div><div class="stat-number">${num}</div><div class="stat-title">${title}</div></div>`;
            document.getElementById('statsGrid').innerHTML =
                card('info', ICONS.wallet, fmtCurrency(total), budget ? `מתוכנן · מתוך ${fmtCurrency(budget)}` : 'סה"כ מתוכנן') +
                card('success', ICONS.check, fmtCurrency(paid), 'שולם') +
                card('warning', ICONS.clock, fmtCurrency(remaining), 'נשאר לשלם') +
                card('', ICONS.guests, expectedGuests() ? fmtCurrency(total / expectedGuests()) : '—', `עלות לאורח (לפי ${fmtNum(expectedGuests())} צפויים)`);

            const byCat = {};
            items.forEach(e => {
                const k = getExpenseCategory(e.category).label;
                byCat[k] = (byCat[k] || 0) + e._total;
            });
            renderBarChart(document.getElementById('catChart'),
                Object.entries(byCat).map(([label, value]) => ({ label, value })),
                { format: fmtCurrency, emptyText: 'עוד לא הוזנו הוצאות' });

            document.getElementById('payChartSub').textContent = `שולם ${fmtPct(paid, total)} מהסכום המתוכנן`;
            renderStackBar(document.getElementById('payChart'), [
                { label: 'שולם', value: paid, color: SERIES_COLORS[2] },
                { label: 'נשאר לשלם', value: remaining, color: '#cbb8c3' },
            ], { format: fmtCurrency, emptyText: 'אין נתונים' });

            const use = document.getElementById('budgetUse');
            if (budget) {
                const pct = Math.round(total / budget * 100);
                use.innerHTML = `
                    <div style="display:flex;justify-content:space-between;font-size:0.88rem;margin-bottom:6px">
                        <span>ניצול התקציב</span>
                        <span><strong>${pct}%</strong> · ${total > budget ? `<span style="color:var(--danger)">חריגה של ${fmtCurrency(total - budget)}</span>` : `נשארו ${fmtCurrency(budget - total)}`}</span>
                    </div>
                    <div class="progress"><div class="progress-fill ${total > budget ? 'over' : ''}" style="width:${Math.min(100, pct)}%"></div></div>`;
            } else {
                use.innerHTML = `<div class="muted">אפשר להגדיר תקציב כולל ב<a href="settings.html">הגדרות החתונה</a></div>`;
            }
        }

        function render() {
            const all = expensesData.map(withTotals);
            renderSummary(all);

            const cat = document.getElementById('filterCat').value;
            const pay = document.getElementById('filterPay').value;
            let list = all.filter(e => {
                if (cat && (e.category || 'other') !== cat) return false;
                if (pay === 'open' && e._remaining <= 0) return false;
                if (pay === 'done' && e._remaining > 0) return false;
                return true;
            });
            list.sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || b._total - a._total);

            const container = document.getElementById('expensesContainer');
            if (!expensesData.length) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">${ICONS.wallet}</div><h3>עוד אין הוצאות</h3><p>הוסיפו את הספקים וההוצאות של החתונה</p></div>`;
                return;
            }
            if (!list.length) {
                container.innerHTML = `<div class="empty-state"><h3>אין תוצאות לסינון הזה</h3></div>`;
                return;
            }
            const today = todayISO();
            const sum = (k) => list.reduce((s, e) => s + e[k], 0);
            container.innerHTML = `
                <div class="table-scroll">
                <table class="data-table cards-mobile">
                    <thead><tr><th>מה</th><th>קטגוריה</th><th>מחיר</th><th>שולם</th><th>נשאר</th><th>תשלום הבא</th><th>סטטוס</th><th></th></tr></thead>
                    <tbody>
                        ${list.map(e => `<tr>
                            <td class="card-head"><div><strong>${escapeHtml(e.name)}</strong>
                                ${e.vendor || e.phone ? `<div class="muted">${escapeHtml(e.vendor || '')}${e.phone ? ` · <a href="tel:${escapeHtml(e.phone)}" dir="ltr">${escapeHtml(e.phone)}</a>` : ''}</div>` : ''}
                                ${e.notes ? `<div class="muted">${escapeHtml(e.notes)}</div>` : ''}</div></td>
                            <td data-label="קטגוריה">${escapeHtml(getExpenseCategory(e.category).label)}</td>
                            <td data-label="מחיר" class="num-cell">${fmtCurrency(e._total)}${e.perGuest ? `<div class="muted">${fmtCurrency(e.unitPrice)} × ${fmtNum(expectedGuests())}</div>` : ''}</td>
                            <td data-label="שולם" class="num-cell">${fmtCurrency(e._paid)}</td>
                            <td data-label="נשאר" class="num-cell">${fmtCurrency(e._remaining)}</td>
                            <td data-label="תשלום הבא">${e.dueDate && e._remaining > 0 ? fmtDate(e.dueDate) + (e.dueDate < today ? ' <span class="badge badge-danger">עבר</span>' : '') : '—'}</td>
                            <td data-label="סטטוס">${payBadge(e)}</td>
                            <td class="actions">
                                ${e._remaining > 0 ? `<button class="btn btn-outline btn-sm" onclick="openPayModal('${e.id}')">רישום תשלום</button>` : ''}
                                <button class="btn-icon" onclick="openExpenseModal('${e.id}')" title="עריכה">${ICONS.edit}</button>
                                <button class="btn-icon danger" onclick="deleteExpense('${e.id}')" title="מחיקה">${ICONS.trash}</button>
                            </td>
                        </tr>`).join('')}
                        <tr class="totals-row">
                            <td class="card-head">סה"כ</td><td></td>
                            <td data-label="מחיר" class="num-cell">${fmtCurrency(sum('_total'))}</td>
                            <td data-label="שולם" class="num-cell">${fmtCurrency(sum('_paid'))}</td>
                            <td data-label="נשאר" class="num-cell">${fmtCurrency(sum('_remaining'))}</td>
                            <td></td><td></td><td></td>
                        </tr>
                    </tbody>
                </table>
                </div>`;
        }

        // ===== Modal =====
        function syncPriceFields() {
            const per = document.getElementById('ePerGuest').checked;
            document.getElementById('eTotalGroup').style.display = per ? 'none' : '';
            document.getElementById('eUnitGroup').style.display = per ? '' : 'none';
            const unit = Number(document.getElementById('eUnit').value) || 0;
            document.getElementById('eUnitHint').textContent = `${fmtNum(expectedGuests())} אורחים צפויים → ${fmtCurrency(unit * expectedGuests())}`;
        }

        function openExpenseModal(id) {
            document.getElementById('expenseForm').reset();
            document.getElementById('expenseId').value = '';
            document.getElementById('expenseError').style.display = 'none';
            document.getElementById('expenseModalTitle').textContent = 'הוספת הוצאה';
            document.getElementById('eCategory').value = 'venue';
            const e = id && expensesData.find(x => x.id === id);
            if (e) {
                document.getElementById('expenseId').value = e.id;
                document.getElementById('eName').value = e.name || '';
                document.getElementById('eCategory').value = e.category || 'other';
                document.getElementById('eVendor').value = e.vendor || '';
                document.getElementById('ePhone').value = e.phone || '';
                document.getElementById('ePerGuest').checked = !!e.perGuest;
                document.getElementById('eTotal').value = e.total ?? '';
                document.getElementById('eUnit').value = e.unitPrice ?? '';
                document.getElementById('ePaid').value = e.paid ?? '';
                document.getElementById('eDue').value = e.dueDate || '';
                document.getElementById('eNotes').value = e.notes || '';
                document.getElementById('expenseModalTitle').textContent = 'עריכת הוצאה';
            } else if (weddingSettings.pricePerGuest) {
                document.getElementById('eUnit').value = weddingSettings.pricePerGuest;
            }
            syncPriceFields();
            openModal('expenseModal');
        }

        async function saveExpense(ev) {
            ev.preventDefault();
            const errEl = document.getElementById('expenseError');
            errEl.style.display = 'none';
            const id = document.getElementById('expenseId').value;
            const num = (elId) => { const v = document.getElementById(elId).value; return v === '' ? null : Number(v); };
            const data = {
                name: document.getElementById('eName').value.trim(),
                category: document.getElementById('eCategory').value,
                vendor: document.getElementById('eVendor').value.trim(),
                phone: document.getElementById('ePhone').value.trim(),
                perGuest: document.getElementById('ePerGuest').checked,
                total: num('eTotal'),
                unitPrice: num('eUnit'),
                paid: num('ePaid') || 0,
                dueDate: document.getElementById('eDue').value || null,
                notes: document.getElementById('eNotes').value.trim(),
            };
            try {
                if (id) await Expenses.update(id, data);
                else await Expenses.add(data);
                closeModal('expenseModal');
            } catch (err) {
                errEl.textContent = 'שגיאה בשמירה: ' + err.message;
                errEl.style.display = 'block';
            }
        }

        function openPayModal(id) {
            const e = expensesData.map(withTotals).find(x => x.id === id);
            if (!e) return;
            document.getElementById('payId').value = id;
            document.getElementById('payInfo').innerHTML = `<strong>${escapeHtml(e.name)}</strong> · שולם ${fmtCurrency(e._paid)} מתוך ${fmtCurrency(e._total)} · נשאר <strong>${fmtCurrency(e._remaining)}</strong>`;
            document.getElementById('payAmount').value = e._remaining || '';
            document.getElementById('payNextDue').value = '';
            openModal('payModal');
        }

        async function confirmPayment(ev) {
            ev.preventDefault();
            const id = document.getElementById('payId').value;
            const e = expensesData.find(x => x.id === id);
            if (!e) return;
            const amount = Number(document.getElementById('payAmount').value) || 0;
            const payments = Array.isArray(e.payments) ? [...e.payments] : [];
            payments.push({ amount, date: todayISO(), by: getDisplayName(currentUser()) });
            try {
                await Expenses.update(id, {
                    paid: (Number(e.paid) || 0) + amount,
                    payments,
                    dueDate: document.getElementById('payNextDue').value || null,
                });
                closeModal('payModal');
            } catch (err) { showAlert('שגיאה: ' + err.message); }
        }

        async function deleteExpense(id) {
            const e = expensesData.find(x => x.id === id);
            if (!e || !await confirmDelete(e.name)) return;
            try { await Expenses.remove(id); }
            catch (err) { showAlert('שגיאה במחיקה: ' + err.message); }
        }

        function exportExpenses() {
            const list = expensesData.map(withTotals);
            if (!list.length) { showAlert('אין הוצאות לייצוא'); return; }
            const rows = [['מה', 'קטגוריה', 'ספק', 'טלפון', 'מחיר', 'שולם', 'נשאר', 'תשלום הבא', 'הערות']];
            list.forEach(e => rows.push([e.name, getExpenseCategory(e.category).label, e.vendor || '', e.phone || '', e._total, e._paid, e._remaining, e.dueDate || '', e.notes || '']));
            rows.push([]);
            rows.push(['סה"כ', '', '', '', list.reduce((s, e) => s + e._total, 0), list.reduce((s, e) => s + e._paid, 0), list.reduce((s, e) => s + e._remaining, 0)]);
            exportToExcel(`תקציב חתונה - ${todayISO()}`, 'תקציב', rows);
        }

        document.getElementById('expensesContainer').innerHTML = '<div class="empty-state"><h3>טוען...</h3></div>';
        document.addEventListener('settings:change', render);
        document.addEventListener('auth:ready', () => {
            Expenses.subscribe(items => { expensesData = items; render(); });
            Guests.subscribe(items => { guestsData = items; render(); });
        });
    </script>
</body>
</html>
